{% load i18n %}
{# Bouton/état « Corrigé » réutilisable (thème sombre). Usage : {% include "contest/include/correction_card.html" with document=document %} #}
{% if document.has_correction %}
  <a href="{{ document.correction_file.url }}" target="_blank" rel="noopener"
     class="inline-flex items-center gap-1.5 rounded-xl border border-brand-500/40 bg-brand-500/10 px-4 py-2 text-sm font-semibold text-brand-300 transition hover:bg-brand-500/20 focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-400">
    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/>
    </svg>
    {% trans 'Voir le corrigé' %}
  </a>
{% else %}
  <span class="inline-flex items-center rounded-xl border border-slate-200 bg-slate-50 px-4 py-2 text-sm text-slate-500" title="{% trans 'Corrigé non disponible pour ce sujet.' %}">
    {% trans 'Corrigé indisponible' %}
  </span>
{% endif %}
