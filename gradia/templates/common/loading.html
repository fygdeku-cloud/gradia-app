{% load i18n %}
{# Indicateur de chargement réutilisable.                    #}
{# Usage : {% include "common/loading.html" with label="..." %} #}
<div class="flex items-center justify-center gap-3 py-6" role="status">
  <svg class="h-5 w-5 animate-spin text-brand-400" fill="none" viewBox="0 0 24 24" aria-hidden="true">
    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentcolor" stroke-width="4"></circle>
    <path class="opacity-75" fill="currentcolor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
  </svg>
  {% if label %}
    <span class="text-sm text-ink-muted">{{ label }}</span>
  {% else %}
    <span class="text-sm text-ink-muted">{% trans 'Chargement…' %}</span>
  {% endif %}
</div>
