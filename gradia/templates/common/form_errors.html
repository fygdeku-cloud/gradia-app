{% load static i18n %}
{# Alertes d'erreurs globales du formulaire (form.non_field_errors). #}
{# Usage : {% include "common/form_errors.html" %} (le contexte doit exposer `form`). #}
{% if form.non_field_errors %}
  <div class="gradia-alert gradia-alert--error" role="alert">
    {% for error in form.non_field_errors %}<p>{{ error }}</p>{% endfor %}
  </div>
{% endif %}
