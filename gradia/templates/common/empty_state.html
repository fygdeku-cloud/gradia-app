{% load i18n %}
{# État vide réutilisable (thème sombre).                          #}
{# Usage : {% include "common/empty_state.html" with title=... description=... %} #}
<div class="gradia-empty-state flex flex-col items-center justify-center px-6 py-12 text-center">
  <span class="gradia-empty-icon mb-3" aria-hidden="true">
    <svg class="h-6 w-6" fill="none" stroke="currentcolor" viewBox="0 0 24 24" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z"/>
    </svg>
  </span>
  <h3 class="text-base font-semibold text-ink">{{ title }}</h3>
  {% if description %}
    <p class="mt-1 max-w-md text-sm text-ink-muted">{{ description }}</p>
  {% endif %}
</div>
