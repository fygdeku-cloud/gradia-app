{% load i18n %}
<section class="gradia-cta" aria-labelledby="gradia-cta-title">
  <div class="mx-auto max-w-2xl px-4 py-12 sm:px-6 lg:px-8">
    <h2 id="gradia-cta-title" class="text-3xl font-extrabold tracking-tight text-slate-900 sm:text-4xl">
      {% trans "Commencez votre préparation dès aujourd'hui." %}
    </h2>
    <p class="mt-4 text-lg text-slate-600">
      {% blocktrans %}Créez votre compte gratuitement et explorez les concours disponibles.{% endblocktrans %}
    </p>
    <div class="cta-buttons mt-8">
      <a href="{% url 'users:register' %}" class="inline-flex items-center justify-center rounded-xl bg-brand-600 px-6 py-3 text-sm font-semibold text-white transition hover:bg-brand-700 focus-visible:ring-4 focus-visible:ring-brand-500/30">
        {% trans "Créer mon compte" %}
      </a>
      <a href="{% url 'users:login' %}" class="inline-flex items-center justify-center rounded-xl border border-slate-300 bg-white px-6 py-3 text-sm font-semibold text-slate-700 shadow-sm transition hover:border-brand-300 hover:bg-brand-50 focus-visible:ring-4 focus-visible:ring-brand-500/20">
        {% trans "J'ai déjà un compte" %}
      </a>
    </div>
  </div>
</section>
