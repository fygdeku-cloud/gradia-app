{% load static i18n %}
<section class="gradia-cta" aria-labelledby="gradia-cta-title">
  <div class="gradia-page-shell max-w-3xl">
    <p class="gradia-eyebrow">{% trans 'Prêt à commencer ?' %}</p>
    <h2 id="gradia-cta-title" class="mt-3 text-3xl font-extrabold tracking-tight text-ink sm:text-4xl">
      {% trans "Commencez votre préparation dès aujourd'hui." %}
    </h2>
    <p class="mt-4 text-lg text-ink-secondary">
      {% blocktrans %}Créez votre compte gratuitement et explorez les concours disponibles.{% endblocktrans %}
    </p>
    <div class="cta-buttons mt-8">
      <a href="{% url 'users:register' %}" class="gradia-btn gradia-btn-primary gradia-btn-lg">
        {% trans "Créer mon compte" %}
      </a>
      <a href="{% url 'users:login' %}" class="gradia-btn gradia-btn-outline-white gradia-btn-lg">
        {% trans "J'ai déjà un compte" %}
      </a>
    </div>
  </div>
</section>
